name: Release (fork)

# Fork-specific release workflow.
# This file replaces the upstream release workflow in this fork only.
# Do not push this workflow to stratumauth/app.
# Required repository secrets:
#   KEYSTORE          base64 of stratum-fork.jks
#   KEYSTORE_PASS     keystore password
#   KEYSTORE_ALIAS    key alias
#   KEYSTORE_KEY_PASS key password
#
# Release assets (each APK contains exactly one ABI):
#   Phone arm64            Stratum-WebDAV-<version>-arm64.apk
#   Phone armeabi-v7a      Stratum-WebDAV-<version>-armeabi-v7a.apk
#   Phone x86_64           Stratum-WebDAV-<version>-x86_64.apk
#   WearOS arm64           Stratum-WearOS-<version>-arm64.apk
#   WearOS armeabi-v7a     Stratum-WearOS-<version>-armeabi-v7a.apk
#   WearOS x86_64          Stratum-WearOS-<version>-x86_64.apk

on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（带 v，例如 v1.7.0）"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CONFIGURATION: Release
  FRAMEWORK: net11.0-android37.0
  ANDROID_API: "37.0"
  BUILD_TOOLS: "37.0.0"

jobs:
  prepare:
    if: github.repository_owner == 'muort521'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version_no: ${{ steps.version.outputs.version_no }}
      version_code: ${{ steps.version.outputs.version_code }}

    steps:
      - name: Resolve release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          RAW="$(printf '%s' "${INPUT_VERSION:-$REF_NAME}" | tr -d '[:space:]')"
          case "$RAW" in
            v*) TAG="$RAW" ;;
            *)  TAG="v$RAW" ;;
          esac

          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式必须是 vX.Y.Z，例如 v1.7.0（收到：$RAW）"
            exit 1
          fi

          VERSION_NO="${TAG#v}"
          MAJOR="${VERSION_NO%%.*}"
          REST="${VERSION_NO#*.}"
          MINOR="${REST%%.*}"
          PATCH="${REST#*.}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version_no=$VERSION_NO" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "发布版本：$TAG → versionName=$VERSION_NO, versionCode=$VERSION_CODE"

  build:
    if: github.repository_owner == 'muort521'
    needs: prepare
    name: build (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: phone-arm64
            project: Stratum.Droid
            apk_base: Stratum-WebDAV
            apk_suffix: arm64
            rids: android-arm64
            abis: "arm64-v8a"
            artifact: Stratum-WebDAV-arm64
          - name: phone-armeabi-v7a
            project: Stratum.Droid
            apk_base: Stratum-WebDAV
            apk_suffix: armeabi-v7a
            rids: android-arm
            abis: "armeabi-v7a"
            artifact: Stratum-WebDAV-armeabi-v7a
          - name: phone-x86_64
            project: Stratum.Droid
            apk_base: Stratum-WebDAV
            apk_suffix: x86_64
            rids: android-x64
            abis: "x86_64"
            artifact: Stratum-WebDAV-x86_64
          - name: wear-arm64
            project: Stratum.WearOS
            apk_base: Stratum-WearOS
            apk_suffix: arm64
            rids: android-arm64
            abis: "arm64-v8a"
            artifact: Stratum-WearOS-arm64
          - name: wear-armeabi-v7a
            project: Stratum.WearOS
            apk_base: Stratum-WearOS
            apk_suffix: armeabi-v7a
            rids: android-arm
            abis: "armeabi-v7a"
            artifact: Stratum-WearOS-armeabi-v7a
          - name: wear-x86_64
            project: Stratum.WearOS
            apk_base: Stratum-WearOS
            apk_suffix: x86_64
            rids: android-x64
            abis: "x86_64"
            artifact: Stratum-WearOS-x86_64

    steps:
      # The upstream tree stores values-en-rGB/strings.xml as symlinks, but on
      # this fork the link blobs contain the full XML. Linux cannot create a
      # symlink whose target is a 30 KB XML document, so disable symlink
      # checkout and materialize the localized files after checkout.
      - name: Disable symlink checkout
        run: git config --global core.symlinks false

      - name: Checkout
        uses: actions/checkout@v5

      - name: Materialize localized strings
        run: |
          set -euo pipefail
          cp Stratum.Droid/Resources/values/strings.xml Stratum.Droid/Resources/values-en-rGB/strings.xml
          cp Stratum.WearOS/Resources/values/strings.xml Stratum.WearOS/Resources/values-en-rGB/strings.xml

      - name: Set APK version
        env:
          PROJECT: ${{ matrix.project }}
          VERSION_NO: ${{ needs.prepare.outputs.version_no }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          set -euo pipefail
          MANIFEST="$PROJECT/Properties/AndroidManifest.xml"
          sed -i "s/android:versionName=\"[^\"]*\"/android:versionName=\"$VERSION_NO\"/" "$MANIFEST"
          sed -i "s/android:versionCode=\"[^\"]*\"/android:versionCode=\"$VERSION_CODE\"/" "$MANIFEST"
          grep -E 'android:versionName|android:versionCode' "$MANIFEST"

      # Keep RuntimeIdentifiers on the app project itself. Passing it as a
      # global -p: property also propagates to Stratum.Core (a plain net11.0
      # library), which then looks for obj/.../android-<abi>/Stratum.Core.dll
      # and fails with MSB3030.
      - name: Set target ABI
        env:
          PROJECT: ${{ matrix.project }}
          RIDS: ${{ matrix.rids }}
        run: |
          set -euo pipefail
          CSPROJ="$PROJECT/$PROJECT.csproj"
          sed -i -E "s#<RuntimeIdentifiers>[^<]*</RuntimeIdentifiers>#<RuntimeIdentifiers>${RIDS}</RuntimeIdentifiers>#" "$CSPROJ"
          grep -n '<RuntimeIdentifiers>' "$CSPROJ"

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up .NET 11
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "11.0.x"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --channel=3 --install "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"

      - name: Restore NuGet packages
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -euo pipefail
          dotnet restore "$PROJECT/$PROJECT.csproj"

      - name: Build Release APK
        env:
          PROJECT: ${{ matrix.project }}
          VERSION_NO: ${{ needs.prepare.outputs.version_no }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          set -euo pipefail
          dotnet publish "$PROJECT/$PROJECT.csproj" \
            -c "$CONFIGURATION" \
            -f "$FRAMEWORK" \
            --no-restore \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" \
            -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:ApplicationDisplayVersion="$VERSION_NO" \
            -p:ApplicationVersion="$VERSION_CODE"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Repository secret KEYSTORE is required}"
          : "${KEYSTORE_PASS:?Repository secret KEYSTORE_PASS is required}"
          : "${KEYSTORE_ALIAS:?Repository secret KEYSTORE_ALIAS is required}"
          : "${KEYSTORE_KEY_PASS:?Repository secret KEYSTORE_KEY_PASS is required}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stratum-fork.jks"

      - name: Sign APK
        env:
          PROJECT: ${{ matrix.project }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          PUBLISH_DIR="$PROJECT/bin/$CONFIGURATION/$FRAMEWORK/publish"
          APK=$(find "$PUBLISH_DIR" -maxdepth 1 -name '*-Signed.apk' -print -quit)
          test -n "$APK"
          "$SDK_ROOT/build-tools/$BUILD_TOOLS/zipalign" -f 4 "$APK" "$RUNNER_TEMP/stratum-aligned.apk"
          "$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/stratum-fork.jks" \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass env:KEYSTORE_PASS \
            --key-pass env:KEYSTORE_KEY_PASS \
            --out "$RUNNER_TEMP/stratum-signed.apk" \
            "$RUNNER_TEMP/stratum-aligned.apk"

      - name: Verify APK version and signature
        env:
          VERSION_NO: ${{ needs.prepare.outputs.version_no }}
          VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          AAPT2="$SDK_ROOT/build-tools/$BUILD_TOOLS/aapt2"
          BADGING="$("$AAPT2" dump badging "$RUNNER_TEMP/stratum-signed.apk")"
          echo "$BADGING" | grep -E "package:|versionCode|versionName"
          echo "$BADGING" | grep -Fq "versionName='$VERSION_NO'" || {
            echo "::error::APK versionName 与发布版本 $VERSION_NO 不一致"
            exit 1
          }
          echo "$BADGING" | grep -Fq "versionCode='$VERSION_CODE'" || {
            echo "::error::APK versionCode 与发布版本 $VERSION_CODE 不一致"
            exit 1
          }
          "$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/stratum-signed.apk" | head -n 5

      - name: Verify APK ABI contents
        env:
          EXPECTED_ABIS: ${{ matrix.abis }}
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/stratum-signed.apk"
          ACTUAL_ABIS="$(unzip -Z1 "$APK" | awk -F/ '$1 == "lib" { print $2 }' | sort -u | tr '\n' ' ')"
          ACTUAL_ABIS="${ACTUAL_ABIS% }"
          echo "APK ABIs: ${ACTUAL_ABIS:-<none>}"
          test "$ACTUAL_ABIS" = "$EXPECTED_ABIS" || {
            echo "::error::APK ABI 不符合预期：期望 [$EXPECTED_ABIS]，实际 [${ACTUAL_ABIS:-<none>}]"
            exit 1
          }

      - name: Name APK
        env:
          APK_BASE: ${{ matrix.apk_base }}
          APK_SUFFIX: ${{ matrix.apk_suffix }}
          VERSION_NO: ${{ needs.prepare.outputs.version_no }}
        run: |
          set -euo pipefail
          APK_NAME="${APK_BASE}-${VERSION_NO}-${APK_SUFFIX}.apk"
          mkdir -p dist
          cp "$RUNNER_TEMP/stratum-signed.apk" "dist/$APK_NAME"
          echo "Built $APK_NAME"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    if: github.repository_owner == 'muort521'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Disable symlink checkout
        run: git config --global core.symlinks false

      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: Stratum-*
          path: dist
          merge-multiple: true

      - name: Prepare release assets
        env:
          VERSION_NO: ${{ needs.prepare.outputs.version_no }}
        run: |
          set -euo pipefail
          test "$(find dist -maxdepth 1 -name '*.apk' | wc -l)" -eq 6
          PHONE_ARM64="Stratum-WebDAV-${VERSION_NO}-arm64.apk"
          PHONE_ARMV7="Stratum-WebDAV-${VERSION_NO}-armeabi-v7a.apk"
          PHONE_X86="Stratum-WebDAV-${VERSION_NO}-x86_64.apk"
          WEAR_ARM64="Stratum-WearOS-${VERSION_NO}-arm64.apk"
          WEAR_ARMV7="Stratum-WearOS-${VERSION_NO}-armeabi-v7a.apk"
          WEAR_X86="Stratum-WearOS-${VERSION_NO}-x86_64.apk"
          for name in "$PHONE_ARM64" "$PHONE_ARMV7" "$PHONE_X86" "$WEAR_ARM64" "$WEAR_ARMV7" "$WEAR_X86"; do
            test -f "dist/$name" || {
              echo "::error::缺少发布包：$name"
              exit 1
            }
          done
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          ls -l dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION_NO: ${{ needs.prepare.outputs.version_no }}
        run: |
          set -euo pipefail
          PHONE_ARM64="Stratum-WebDAV-${VERSION_NO}-arm64.apk"
          PHONE_ARMV7="Stratum-WebDAV-${VERSION_NO}-armeabi-v7a.apk"
          PHONE_X86="Stratum-WebDAV-${VERSION_NO}-x86_64.apk"
          WEAR_ARM64="Stratum-WearOS-${VERSION_NO}-arm64.apk"
          WEAR_ARMV7="Stratum-WearOS-${VERSION_NO}-armeabi-v7a.apk"
          WEAR_X86="Stratum-WearOS-${VERSION_NO}-x86_64.apk"

          # 清理同版本旧 Release / tag，保证重复运行不会沿用旧附件或旧 tag 时间。
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "删除已存在的 Release $TAG"
            gh release delete "$TAG" --yes --cleanup-tag || gh release delete "$TAG" --yes
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" >/dev/null 2>&1 || true
          git tag -d "$TAG" >/dev/null 2>&1 || true

          # annotated tag：让 GitHub 的 Source code 时间使用当前时间。
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push -f origin "refs/tags/$TAG"

          sleep 5
          ok=0
          for i in 1 2 3 4 5; do
            if gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
                 --title "Stratum $TAG" \
                 --generate-notes; then
              ok=1
              break
            fi
            echo "::warning::gh release create 第 $i 次失败，$((i * 10))s 后重试"
            sleep $((i * 10))
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber; then
                ok=1
                break
              fi
            fi
          done

          if [ "$ok" -ne 1 ]; then
            echo "::error::创建 Release $TAG 失败；tag 已推送，可稍后重跑本工作流。"
            exit 1
          fi

          ASSETS="$(gh release view "$TAG" --json assets -q '.assets[].name')"
          echo "Release 附件：$ASSETS"
          for name in "$PHONE_ARM64" "$PHONE_ARMV7" "$PHONE_X86" "$WEAR_ARM64" "$WEAR_ARMV7" "$WEAR_X86" "SHA256SUMS.txt"; do
            echo "$ASSETS" | grep -Fqx "$name" || {
              echo "::error::发布附件未上传成功：$name"
              exit 1
            }
          done
          gh release view "$TAG" --json tagName,url,assets \
            -q '"\(.tagName) → \(.url)\n附件：\(.assets[].name)"'
