name: Release (fork)

# Fork-specific release workflow.
# This file replaces the upstream release workflow in this fork only.
# Do not push this workflow to stratumauth/app.
# Required repository secrets:
#   KEYSTORE          base64 of stratum-fork.jks
#   KEYSTORE_PASS     keystore password
#   KEYSTORE_ALIAS    key alias
#   KEYSTORE_KEY_PASS key password

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  CONFIGURATION: Release
  FRAMEWORK: net11.0-android37.0
  ANDROID_API: "37.0"
  BUILD_TOOLS: "37.0.0"

jobs:
  build:
    if: github.repository_owner == 'muort521'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # The upstream tree stores values-en-rGB/strings.xml as symlinks, but on
      # this fork the link blobs contain the full XML. Linux cannot create a
      # symlink whose target is a 30 KB XML document, so disable symlink
      # checkout and materialize the localized files after checkout.
      - name: Disable symlink checkout
        run: git config --global core.symlinks false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Materialize localized strings
        run: |
          set -euo pipefail
          cp Stratum.Droid/Resources/values/strings.xml Stratum.Droid/Resources/values-en-rGB/strings.xml
          cp Stratum.WearOS/Resources/values/strings.xml Stratum.WearOS/Resources/values-en-rGB/strings.xml

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Install Android workload
        run: dotnet workload install android

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --channel=3 --install "platform-tools" "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"

      - name: Restore NuGet packages
        run: dotnet restore Stratum.Droid/Stratum.Droid.csproj

      - name: Build Release APK
        run: |
          set -euo pipefail
          dotnet publish Stratum.Droid/Stratum.Droid.csproj \
            -c "$CONFIGURATION" \
            -f "$FRAMEWORK" \
            --no-restore \
            -p:AndroidSdkDirectory="$ANDROID_SDK_ROOT" \
            -p:JavaSdkDirectory="$JAVA_HOME"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Repository secret KEYSTORE is required}"
          : "${KEYSTORE_PASS:?Repository secret KEYSTORE_PASS is required}"
          : "${KEYSTORE_ALIAS:?Repository secret KEYSTORE_ALIAS is required}"
          : "${KEYSTORE_KEY_PASS:?Repository secret KEYSTORE_KEY_PASS is required}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stratum-fork.jks"

      - name: Sign APK
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASS: ${{ secrets.KEYSTORE_KEY_PASS }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APK=$(find "Stratum.Droid/bin/$CONFIGURATION/$FRAMEWORK/publish" -maxdepth 1 -name '*-Signed.apk' -print -quit)
          test -n "$APK"
          "$SDK_ROOT/build-tools/$BUILD_TOOLS/zipalign" -f 4 "$APK" "$RUNNER_TEMP/stratum-aligned.apk"
          "$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/stratum-fork.jks" \
            --ks-key-alias "$KEYSTORE_ALIAS" \
            --ks-pass env:KEYSTORE_PASS \
            --key-pass env:KEYSTORE_KEY_PASS \
            --out "$RUNNER_TEMP/stratum-signed.apk" \
            "$RUNNER_TEMP/stratum-aligned.apk"
          "$SDK_ROOT/build-tools/$BUILD_TOOLS/apksigner" verify "$RUNNER_TEMP/stratum-signed.apk"

      - name: Name APK
        run: |
          set -euo pipefail
          VERSION_NAME=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' Stratum.Droid/Properties/AndroidManifest.xml | head -1)
          VERSION_CODE=$(sed -n 's/.*android:versionCode="\([^"]*\)".*/\1/p' Stratum.Droid/Properties/AndroidManifest.xml | head -1)
          VERSION_NAME=${VERSION_NAME:-1.7.0}
          VERSION_CODE=${VERSION_CODE:-17}
          mkdir -p dist
          APK_NAME="Stratum-WebDAV-${VERSION_NAME}-${VERSION_CODE}.apk"
          cp "$RUNNER_TEMP/stratum-signed.apk" "dist/$APK_NAME"
          (cd dist && sha256sum "$APK_NAME" > SHA256SUMS.txt)
          echo "APK_NAME=$APK_NAME" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Stratum-WebDAV-APK
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Stratum WebDAV ${{ github.ref_name }}
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
          generate_release_notes: true
          draft: true
